name: pages

# main への push で、公開用ディレクトリ _site/ だけを GitHub Pages に出す。
# _site/ は site/ と artifacts/ の .webp・manifest.json だけから作る（tools/build_site.py）。
# provenance.json や、リポジトリのほかのディレクトリはアップロードしない。
#
# 初回だけ、リポジトリの Settings → Pages → Build and deployment を
# 「GitHub Actions」にする。URL は https://<owner>.github.io/<repo>/ になる。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "artifacts/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
